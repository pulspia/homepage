# Pulspia 홈페이지 Nginx 설정 파일
# React SPA(Single Page Application) 라우팅 지원

# 이 설정을 nginx 서버 블록에 추가하세요
# 위치: /etc/nginx/sites-available/your-domain 또는 nginx.conf

server {
    listen 80;
    listen [::]:80;

    # 도메인 이름 설정
    server_name pulspia.com www.pulspia.com localhost;

    # 웹 루트 디렉토리 (build 폴더가 업로드된 경로)
    root /var/www/pulspia.com;

    # 기본 인덱스 파일
    index index.html;

    # Gzip 압축 활성화 (성능 최적화)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/javascript application/json
               image/svg+xml;

    # 보안 헤더 설정
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 서비스 프록시 (basePath: /services 사용)
    # web-mbti Next.js 앱 - 모든 /services/* 경로 처리
    location ^~ /services {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Next.js 정적 리소스 프록시 (_next, fonts 등)
    location ^~ /_next/ {
        proxy_pass http://localhost:3000/_next/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # 정적 리소스 캐싱
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # img-gen 백엔드 API 프록시 (포트 8003)
    location /api/img-gen/ {
        proxy_pass http://localhost:8003/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;  # 이미지 생성에 시간이 오래 걸릴 수 있음
    }

    # 기본 백엔드 API 프록시 (Ollama 기반 - 포트 8001)
    location /api/ {
        proxy_pass http://localhost:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;

        # OPTIONS 요청 처리 (CORS preflight)
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";
            return 204;
        }
    }

    # 모니터링 서버 프록시
    location /monitor/ {
        proxy_pass http://localhost:8002/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # SPA 라우팅 처리
    # 모든 경로 요청을 index.html로 전달
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 정적 파일 캐싱 (CSS, JS, 이미지)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # HTML 파일은 캐싱하지 않음 (항상 최신 버전 제공)
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # 특정 파일/폴더 접근 차단
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 로그 파일 위치
    access_log /var/log/nginx/pulspia-access.log;
    error_log /var/log/nginx/pulspia-error.log;
}

